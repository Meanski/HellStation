<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">HellStation</title>
  <desc id="d">Diablo II: Lord of Destruction, native on PlayStation 2</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="115%" r="95%">
      <stop offset="0" stop-color="#5a0d07"/>
      <stop offset="0.45" stop-color="#1c0605"/>
      <stop offset="1" stop-color="#0b0a0d"/>
    </radialGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.45" stop-color="#f0702a"/>
      <stop offset="1" stop-color="#a3160c"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <g fill="#ff8a3d" opacity="0.55">
    <circle cx="210" cy="250" r="2"/><circle cx="268" cy="214" r="1.4"/><circle cx="330" cy="268" r="1.8"/>
    <circle cx="955" cy="236" r="2"/><circle cx="1012" cy="262" r="1.5"/><circle cx="1080" cy="206" r="1.2"/>
    <circle cx="640" cy="292" r="1.6"/><circle cx="520" cy="276" r="1.2"/><circle cx="760" cy="270" r="1.4"/>
  </g>
  <text x="640" y="172" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="112"
        font-weight="700" letter-spacing="14" fill="url(#ember)" filter="url(#glow)">HELLSTATION</text>
  <rect x="340" y="204" width="600" height="2" fill="url(#rule)"/>
  <text x="640" y="248" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="24" letter-spacing="6" fill="#e9d6c4" opacity="0.9">DIABLO II · LORD OF DESTRUCTION · NATIVE ON PS2</text>
  <rect width="1280" height="320" fill="url(#scan)"/>
</svg>
